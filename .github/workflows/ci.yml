name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ubuntu:
    name: Rust / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo fetch --locked
      - run: cargo clippy --offline --workspace --all-targets --locked -- -D warnings
      - name: Versions 0–3 regression, goldens, bounds and fixed-seed campaigns
        run: cargo test --offline --workspace --locked
      - name: Version 3 deployed schemas and fixture/file safety
        run: |
          cargo test --offline --locked -p jocky-ir --test schema --test report --test safety
          cargo test --offline --locked -p jocky-language --test artifact_io --test artifact_reads --test artifact_publish --test fixture_cli

  rust-windows:
    name: Rust / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo fetch --locked
      - run: cargo clippy --offline --workspace --all-targets --locked -- -D warnings
      - name: Versions 0–3 regression, goldens, bounds and fixed-seed campaigns
        run: cargo test --offline --workspace --locked
      - name: Version 3 deployed schemas and fixture/file safety
        run: |
          cargo test --offline --locked -p jocky-ir --test schema --test report --test safety
          cargo test --offline --locked -p jocky-language --test artifact_io --test artifact_reads --test artifact_publish --test fixture_cli

  native-linux-offline:
    name: Linux adapter / ${{ matrix.toolchain }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.98.1", stable]
        profile: [core, journal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Install optional journal build prerequisite
        if: matrix.profile == 'journal'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends libsystemd-dev pkg-config
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - name: Verify one-way native dependency boundary
        run: cargo metadata --locked --offline --format-version 1 | python ci/check_native_boundary.py
      - name: Core offline checks
        if: matrix.profile == 'core'
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test --workspace --locked --offline
      - name: Journal-feature offline checks (no live journal access)
        if: matrix.profile == 'journal'
        run: |
          cargo clippy -p jocky-native-linux --features journal --all-targets --locked --offline -- -D warnings
          cargo test -p jocky-native-linux --features journal --locked --offline

  controller:
    name: Python controller
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: controller/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - name: Check native boundary utility offline
        working-directory: .
        run: |
          python -m ruff format --check --config controller/pyproject.toml ci/check_native_boundary.py tests/test_native_boundary.py
          python -m ruff check --config controller/pyproject.toml ci/check_native_boundary.py tests/test_native_boundary.py
          python -m mypy --strict --explicit-package-bases ci/check_native_boundary.py tests/test_native_boundary.py
          python -m pytest tests/test_native_boundary.py

  dashboard:
    name: TypeScript dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
